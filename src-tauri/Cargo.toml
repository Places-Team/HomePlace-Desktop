[package]
name = "homeplace-desktop"
version = "0.1.0"
description = "Native desktop companion for HomePlace"
authors = ["Olmae"]
edition = "2024"

[lib]
name = "homeplace_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
futures-util = "0.3"
hostname = "0.4"
os_info = "3"
p256 = { version = "0.13", features = ["pkcs8"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2.4"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2.4.5"
time = { version = "0.3", features = ["parsing"] }
tokio = { version = "1", features = ["macros", "sync", "time"] }
url = "2"
uuid = "1"
zeroize = "1"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["crypto-rust", "linux-native-sync-persistent", "vendored"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
